name: Nightly contract tests (MinIO)

# The shared contract suite against a real MinIO in Testcontainers. Not part of PR CI by design;
# run it by hand from the Actions tab when a protocol change needs checking.
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build tests/InMemoryBucket.Tests.MinIO -c Release
      - run: dotnet test --project tests/InMemoryBucket.Tests.MinIO --no-build -c Release
        env:
          # A specific MinIO build (commit ee9fee07), pinned by digest: the free Chainguard image publishes only :latest,
          # versioned tags are paid. The run then changes only when we bump the digest, not when :latest moves.
          INMEMORYBUCKET_MINIO_IMAGE: cgr.dev/chainguard/minio@sha256:59953701f8f8d0de81aab456f0b0b6c0a1804119415559bf7ede79d944108879
