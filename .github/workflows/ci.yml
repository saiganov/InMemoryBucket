name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    # ready_for_review: a draft PR runs nothing; marking it ready starts the tests.
    types: [opened, synchronize, reopened, ready_for_review]
  # Daily, so the latest-SDK leg notices a new AWSSDK.S3 release even when nobody pushes. Never publishes.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Draft PRs are work in progress: no CI until the PR is marked ready for review.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: test (AWSSDK.S3 ${{ matrix.aws-sdk.name }})
    runs-on: ubuntu-latest
    # A break on the newest SDK shows as a red leg but does not block publish: the packages come from the minimum leg.
    continue-on-error: ${{ matrix.aws-sdk.name == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        # minimum: the floor in Directory.Packages.props, what the packages depend on (and the leg that packs).
        # latest: the newest AWSSDK.S3 4.x, to hear about SDK changes before users do.
        aws-sdk:
          - { name: minimum, version: '' }
          - { name: latest, version: '4.*' }
    env:
      SDK_ARGS: ${{ matrix.aws-sdk.version != '' && format('-p:AwsSdkS3Version={0}', matrix.aws-sdk.version) || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore ${SDK_ARGS:+"$SDK_ARGS"}
      - run: dotnet build --no-restore -c Release ${SDK_ARGS:+"$SDK_ARGS"}
      - name: AWSSDK.S3 version under test
        run: grep -o '"AWSSDK.S3/[^"]*"' tests/InMemoryBucket.Tests/obj/project.assets.json | head -1
      # Every test project except the MinIO contract run, which needs Docker and runs nightly (nightly.yml).
      - name: Test
        run: |
          set -e
          for project in tests/*/*.csproj; do
            case "$project" in */InMemoryBucket.Tests.MinIO/*) continue ;; esac
            echo "::group::$project"
            dotnet test --project "$project" --no-build -c Release
            echo "::endgroup::"
          done
      # Runs package validation on every PR, not only when publishing. Only the minimum leg: its build is what ships.
      - name: Pack
        if: matrix.aws-sdk.name == 'minimum'
        run: |
          set -e
          for project in src/*/*.csproj; do
            dotnet pack "$project" --no-build -c Release -o artifacts
          done

  publish:
    # Packages go to nuget.org. Only a v* tag publishes, with the version from the tag (v0.1.0-preview.1 -> 0.1.0-preview.1). Pushes to main do not.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository_owner == 'saiganov'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Trusted Publishing: nuget.org trades the workflow's OIDC token for a short-lived API key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet pack -c Release -o artifacts -p:Version=${GITHUB_REF_NAME#v}
      - name: Log in to nuget.org
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      # Pushes the .snupkg symbol packages next to each .nupkg as well.
      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"
          --skip-duplicate
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
